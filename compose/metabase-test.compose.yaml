# Disposable native Metabase fixture; never use these public credentials live.
services:
  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase_fixture
      POSTGRES_USER: metabase_fixture
      POSTGRES_PASSWORD: fixture-only-not-for-deployment
    volumes:
      - metabase-fixture-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U metabase_fixture -d metabase_fixture]
      interval: 2s
      timeout: 3s
      retries: 30
  metabase:
    image: metabase/metabase:v0.60.7
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_DBNAME: metabase_fixture
      MB_DB_USER: metabase_fixture
      MB_DB_PASS: fixture-only-not-for-deployment
      MB_ANON_TRACKING_ENABLED: "false"
      MB_REPORT_TIMEZONE: UTC
      MB_HTTP_CHANNEL_HOST_STRATEGY: allow-private
      JAVA_TOOL_OPTIONS: -Xmx768m
    ports:
      - "127.0.0.1:13021:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - default
      - fixture-database
    depends_on:
      metabase-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
volumes:
  metabase-fixture-db:
networks:
  fixture-database:
    external: true
    name: ${HUBOS_TEST_DB_NETWORK:-hubos-v02-foundation-test_default}
