# HTTPS operator access. Tool/database administration remains private.
services:
  api:
    environment:
      HUBOS_TLS_ENABLED: "true"
  caddy:
    ports: !override
      - "${HUBOS_BIND_ADDRESS:-127.0.0.1}:${HUBOS_HTTP_PORT:-80}:80"
      - "${HUBOS_BIND_ADDRESS:-127.0.0.1}:${HUBOS_HTTPS_PORT:-443}:${HUBOS_HTTPS_PORT:-443}"
