services:
  metabase-bootstrap:
    build:
      context: ./services/hubos
    image: hubos/core:local
    command: ["bun", "run", "metabase:bootstrap"]
    environment:
      HUBOS_ENV: ${HUBOS_ENV:-development}
      HUBOS_DATABASE_URL: ${HUBOS_DATABASE_URL:-postgresql://hubos:hubos-local-only@db:5432/hubos}
      HUBOS_DEMO_MODE: ${HUBOS_DEMO_MODE:-false}
      METABASE_URL: http://metabase:3000
      METABASE_ADMIN_FIRST_NAME: ${METABASE_ADMIN_FIRST_NAME:-HubOS}
      METABASE_ADMIN_LAST_NAME: ${METABASE_ADMIN_LAST_NAME:-Administrator}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@hubos.local}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-hubos-local-admin-1}
      METABASE_HUBOS_DB_HOST: db
      METABASE_HUBOS_DB_NAME: ${POSTGRES_DB:-hubos}
      METABASE_HUBOS_DB_USER: ${METABASE_HUBOS_DB_USER:-hubos_analytics}
      METABASE_HUBOS_DB_PASSWORD: ${METABASE_HUBOS_DB_PASSWORD:-hubos-local-analytics-only}
      METABASE_WEBHOOK_KEY: ${METABASE_WEBHOOK_KEY:-local-metabase-webhook-key}
    depends_on:
      metabase:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  api:
    environment:
      METABASE_WEBHOOK_KEY: ${METABASE_WEBHOOK_KEY:-local-metabase-webhook-key}

  metabase-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase-local-only}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  metabase:
    image: metabase/metabase:v0.60.7
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase-local-only}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_ENABLE_EMBEDDING: "false"
      MB_REPORT_TIMEZONE: UTC
      MB_SITE_NAME: HubOS Monitoring and Evaluation
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3001}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_SECRET_KEY:-aHViT3MtbG9jYWwtb25seS1lbmNyeXB0aW9uLWtleQ==}
    ports:
      - "${HUBOS_BIND_ADDRESS:-127.0.0.1}:${METABASE_PORT:-3001}:3000"
    depends_on:
      metabase-db:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend
      - frontend

volumes:
  metabase-db-data:
