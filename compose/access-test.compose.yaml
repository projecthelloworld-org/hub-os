services:
  api:
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    command: [bun, test/fixtures/access-api.js]
    volumes:
      - ../services/hubos:/app:ro
    networks: [backend]
    healthcheck:
      test: [CMD, bun, -e, 'const r=await fetch("http://localhost:3000/healthz");process.exit(r.ok?0:1)']
      interval: 2s
      timeout: 3s
      retries: 30
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - 127.0.0.1:13041:80
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      HUBOS_SITE_ADDRESS: ':80'
      HUBOS_OPERATOR_USERNAME: fixture-operator
      HUBOS_OPERATOR_PASSWORD_HASH: '$$2b$$10$$D5VbJn0dVrgh8O6DWzfrkeXQob1eOT18ivB9AsRUZvHmaZCKuZVVu'
      HUBOS_ADMIN_KEY: fixture-only-admin-key
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, frontend]
networks:
  backend:
    internal: true
  frontend:
