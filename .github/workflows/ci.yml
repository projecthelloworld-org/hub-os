name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/hubos
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare isolated PostgreSQL integration fixture
        working-directory: .
        run: |
          docker compose -p hubos-ci-test -f compose/test.compose.yaml up -d --wait db
          docker compose -p hubos-ci-test -f compose/test.compose.yaml run --rm migrate
      - run: bun test
        env:
          HUBOS_TEST_DATABASE_URL: postgresql://hubos_test:fixture-only-not-for-deployment@127.0.0.1:15432/hubos_test
      - run: bun run check
      - name: Validate Pages builder syntax
        working-directory: .
        run: bun build scripts/build-pages.js --target=bun --outfile=/tmp/hubos-pages-build.js
      - run: bun audit --audit-level=moderate
      - name: Validate core Compose configuration
        working-directory: .
        run: make compose-config
      - name: Validate installer syntax
        working-directory: .
        run: bash -n install.sh
      - name: Clean isolated PostgreSQL fixture
        if: always()
        working-directory: .
        run: docker compose -p hubos-ci-test -f compose/test.compose.yaml down --volumes

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: hubos-sbom.spdx.json
