name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUBOS_TEST_DB_NETWORK: hubos-ci-test_default
    defaults:
      run:
        working-directory: services/hubos
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare isolated PostgreSQL, Kuma and Metabase integration fixtures
        working-directory: .
        run: |
          docker compose -p hubos-ci-test -f compose/test.compose.yaml up -d --wait db
          docker compose -p hubos-ci-test -f compose/test.compose.yaml run --rm migrate
          docker compose -p hubos-ci-kuma-test -f compose/kuma-test.compose.yaml up -d --wait
          docker compose -p hubos-ci-metabase-test -f compose/metabase-test.compose.yaml up -d --wait
          docker compose -p hubos-ci-metabase-test -f compose/metabase-test.compose.yaml pull receiver
      - run: bun test
        env:
          HUBOS_TEST_DATABASE_URL: postgresql://hubos_test:fixture-only-not-for-deployment@127.0.0.1:15432/hubos_test
          HUBOS_TEST_INSTALLER_CONFIG: "true"
          HUBOS_TEST_KUMA_URL: http://127.0.0.1:13002
          HUBOS_TEST_METABASE_URL: http://127.0.0.1:13021
          # Kuma's ephemeral host receiver must be reachable from its container.
          # Metabase uses the separate same-network receiver container instead.
          HUBOS_TEST_CALLBACK_BIND: 0.0.0.0
          HUBOS_TEST_METABASE_PROJECT: hubos-ci-metabase-test
      - run: bun run check
      - name: Report isolated integration service diagnostics
        if: failure()
        working-directory: .
        run: |
          docker compose -p hubos-ci-metabase-test -f compose/metabase-test.compose.yaml logs --tail=600 metabase | sed '/|[[:space:]]*at /d'
          docker compose -p hubos-ci-kuma-test -f compose/kuma-test.compose.yaml logs --tail=80 kuma
      - name: Validate Pages builder syntax
        working-directory: .
        run: bun build scripts/build-pages.js --target=bun --outfile=/tmp/hubos-pages-build.js
      - run: bun audit --audit-level=moderate
      - name: Validate core Compose configuration
        working-directory: .
        run: make compose-config
      - name: Validate installer syntax
        working-directory: .
        run: bash -n install.sh
      - name: Clean isolated integration fixtures
        if: always()
        working-directory: .
        run: |
          docker compose -p hubos-ci-metabase-test -f compose/metabase-test.compose.yaml down --volumes
          docker compose -p hubos-ci-kuma-test -f compose/kuma-test.compose.yaml down --volumes
          docker compose -p hubos-ci-test -f compose/test.compose.yaml down --volumes

  metabase-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUBOS_TEST_DB_NETWORK: hubos-ci-meta-upgrade-db_default
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Start fresh legacy application database fixture
        run: |
          docker compose -p hubos-ci-meta-upgrade-db -f compose/test.compose.yaml up -d --wait db
          docker compose -p hubos-ci-metabase-upgrade-test -f compose/metabase-upgrade-test.compose.yaml up -d --wait --wait-timeout 300
      - name: Verify actual application migrations and resource preservation
        run: bun test test/metabase-upgrade.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_DATABASE_URL: postgresql://hubos_test:fixture-only-not-for-deployment@127.0.0.1:15432/hubos_test
          HUBOS_TEST_METABASE_UPGRADE_PROJECT: hubos-ci-metabase-upgrade-test
      - name: Clean only the disposable upgrade fixture
        if: always()
        run: |
          docker compose -p hubos-ci-metabase-upgrade-test -f compose/metabase-upgrade-test.compose.yaml down --volumes
          docker compose -p hubos-ci-meta-upgrade-db -f compose/test.compose.yaml down --volumes

  headwind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/hubos
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Start disposable Headwind Community fixture
        working-directory: .
        run: docker compose -p hubos-ci-headwind-test -f compose/headwind-test.compose.yaml up -d --wait
      - name: Verify actual inventory, check-ins and minimum account
        run: bun test test/headwind.integration.test.js
        env:
          HUBOS_TEST_HEADWIND_URL: http://127.0.0.1:13031/
      - name: Record deployed Headwind artifact
        working-directory: .
        run: |
          docker compose -p hubos-ci-headwind-test -f compose/headwind-test.compose.yaml exec -T hmdm sha256sum /usr/local/tomcat/work/cache/hmdm-5.39.2-os.war /usr/local/tomcat/webapps/ROOT.war
          docker image inspect headwindmdm/hmdm:0.1.8 --format '{{json .RepoDigests}}'
      - name: Clean disposable Headwind fixture
        if: always()
        working-directory: .
        run: docker compose -p hubos-ci-headwind-test -f compose/headwind-test.compose.yaml down --volumes

  access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Start owned API and proxy access fixture
        run: docker compose -p hubos-v02-access-test -f compose/access-test.compose.yaml up -d --wait
      - name: Validate authenticated routing
        run: docker compose -p hubos-v02-access-test -f compose/access-test.compose.yaml exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify operator and machine access boundaries
        run: bun test test/access.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_ACCESS_URL: http://127.0.0.1:13041/
      - name: Install Chromium for console checks
        working-directory: services/hubos
        run: bun node_modules/playwright/cli.js install --with-deps chromium
      - name: Reset only the synthetic in-memory console fixture
        run: |
          docker compose -p hubos-v02-access-test -f compose/access-test.compose.yaml restart api
          docker compose -p hubos-v02-access-test -f compose/access-test.compose.yaml up -d --wait --wait-timeout 90
      - name: Verify console layouts and operator workflows
        working-directory: services/hubos
        run: bun test test/console.browser.integration.test.js
        env:
          HUBOS_TEST_CONSOLE_URL: http://127.0.0.1:13041/
      - name: Retain synthetic console screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-console-layouts
          path: output/playwright/*.png
          if-no-files-found: ignore
      - name: Clean only the disposable access fixture
        if: always()
        run: docker compose -p hubos-v02-access-test -f compose/access-test.compose.yaml down --volumes

  odk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Prepare pinned upstream ODK sources
        run: |
          sh scripts/vendor-ecosystem.sh
          test "$(git -C vendor/odk-central rev-parse HEAD)" = ee0e4207ab6fb628247f4d5b5b576325782a5a05
          test "$(git -C vendor/odk-central/server rev-parse HEAD)" = bee93414a2215bd73d7f371113c6640c66d90c95
      - name: Start isolated API-only Central fixture
        run: docker compose -p hubos-v02-odk-test -f compose/odk-test.compose.yaml up -d --build --wait --wait-timeout 300 service
      - name: Verify optional application private port bindings
        run: bun test test/transport.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_INSTALLER_CONFIG: "true"
          HUBOS_TEST_ECOSYSTEM_CONFIG: "true"
      - name: Validate form and verify actual read-only OData client
        run: bun scripts/test-odk.js
      - name: Clean only the disposable ODK fixture
        if: always()
        run: docker compose -p hubos-v02-odk-test -f compose/odk-test.compose.yaml down --volumes

  tls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Verify certificate trust, HTTP redirects and HTTPS operator origin
        run: bun test test/tls.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_TLS_PROJECT: hubos-ci-tls-test
      - name: Clean only the isolated TLS fixture
        if: always()
        run: docker compose -p hubos-ci-tls-test -f compose/access-test.compose.yaml -f compose/tls.compose.yaml -f compose/tls-test.compose.yaml down --volumes

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Verify actual fresh and repeat installation with private isolated services
        run: bun test test/installer.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_INSTALLER_PROJECT: hubos-ci-installer-test
          HUBOS_TEST_INSTALLER_RESULT_FILE: /tmp/hubos-ci-installer-directory.txt
      - name: Verify consistent backup and isolated restoration of actual applications
        run: |
          export HUBOS_TEST_BACKUP_SOURCE_DIR="$(cat /tmp/hubos-ci-installer-directory.txt)"
          bun test test/backup.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_BACKUP_PROJECT: hubos-ci-installer-test
          HUBOS_TEST_RECOVERY_PROJECT: hubos-ci-recovery-test
      - name: Report only owned installer service state
        if: failure()
        run: docker ps -a --filter label=com.docker.compose.project=hubos-ci-installer-test --format '{{.Names}} {{.Status}}'
      - name: Clean only disposable installer services and storage
        if: always()
        run: |
          docker compose -p hubos-ci-installer-test -f compose.yaml -f compose/mel.compose.yaml -f compose/monitoring.compose.yaml down --volumes
          docker compose -p hubos-ci-recovery-test -f compose.yaml -f compose/mel.compose.yaml -f compose/monitoring.compose.yaml down --volumes

  package-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: services/hubos
      - name: Verify the published package upgrades through a sealed HTTPS installer
        run: bun test test/package-upgrade.integration.test.js
        working-directory: services/hubos
        env:
          HUBOS_TEST_PACKAGE_PROJECT: hubos-ci-package-test
      - name: Report only the owned package fixture state
        if: failure()
        run: docker ps -a --filter label=com.docker.compose.project=hubos-ci-package-test --format '{{.Names}} {{.Status}}'
      - name: Clean only disposable package fixture services and storage
        if: always()
        run: docker compose -p hubos-ci-package-test -f compose.yaml -f compose/mel.compose.yaml -f compose/monitoring.compose.yaml -f compose/development.compose.yaml down --volumes --remove-orphans

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: hubos-sbom.spdx.json
